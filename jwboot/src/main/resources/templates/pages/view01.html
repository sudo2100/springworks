<!DOCTYPE html>
<!-- 타임리프 네임스페이스 선언 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">제목</title>
</head>
<body>
    <h2 th:text="${title}">제목</h2>
    <p>웹 요청 URL은 <b th:text="${url}">URL</b> 입니다.</p>
    <hr>
    <!-- 인라인 표현식-->
    <h3>[[${title}]] 페이지입니다.</h3>
</body>
</html>
