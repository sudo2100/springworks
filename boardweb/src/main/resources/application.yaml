spring:
  application:
    name: boardweb

    # DataSource 설정 - mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/springdb?serverTimezone=Asia/Seoul
    username: javauser
    password: pwjava

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update  #create(초기화), update(유지)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}     # 환경변수로 주입 (코드에 키를 쓰지 않는다)
        chat:
          model: gemini-3.6-flash      # 사용할 Gemini 모델
          temperature: 0.7             # 0에 가까울수록 일정한 답, 1에 가까울수록 다양한 답