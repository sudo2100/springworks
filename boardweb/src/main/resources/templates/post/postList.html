<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- 로그인 상태(우측 상단) -->
    <div class="container d-flex justify-content-end align-items-center gap-2 py-2">
        <th:block th:if="${loginUser == null}">
            <a th:href="@{/login}" class="btn btn-outline-primary btn-sm">로그인</a>
            <a th:href="@{/siginup}" class="btn btn-outline-success btn-sm">회원가입</a>
        </th:block>
        <th:block th:if="${loginUser != null}">
            <span th:text="${loginUser}">아이디님</span>
            <a th:if="${isAdmin}" th:href="@{/admin}" class="btn btn-outline-danger btn-sm">관리자</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
            </form>
        </th:block>
    </div>


    <div class="p-5 mb-4 text-center bg-light">
        <h1 class="mb-2">My Board</h1>
        <p class="text-muted mb-0">Spring Boot, JPA, Thymeleaf 게시판</p>
    </div>

    <div class="container" style="width: 80%">
        <!-- 검색 영역 -->
        <form th:action="@{/posts}" method="get" class="row g-2 justify-content-end mb-3">
            <div class="col-auto">
                <select name="type" class="form-select">
                    <option value="title"
                        th:selected="${param.type == null or param.type[0] == 'title'}">제목</option>
                    <option value="content"
                        th:selected="${param.type != null and param.type[0] == 'content'}">내용</option>
                    <option value="writer"
                        th:selected="${param.type != null and param.type[0] == 'writer'}">글쓴이</option>
                </select>
            </div>
            <div class="col-auto">
                <input type="text" name="keyword" class="form-control"
                       th:value="${param.keyword}" placeholder="검색어를 입력하세요">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">검색</button>
                <a th:href="@{/posts}" class="btn btn-outline-secondary">초기화</a>
            </div>
        </form>

        <!-- 게시글 총 수, 글쓰기 버튼 -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span th:text="| 전체 ${#lists.size(posts)} |">전체 0건</span>
            <a th:href="@{/new-post}" class="btn btn-primary">글쓰기</a>
        </div>

        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th style="width: 80px">번호</th>
                    <th>제목</th>
                    <th style="width: 120px">글쓴이</th>
                    <th style="width: 180px">작성일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="post: ${posts}">
                    <td th:text="${post.id}">1</td>
                    <td>
                        <a th:href="@{/posts/{id}(id=${post.id})}"
                           th:text="${post.title}">제목</a>
                    </td>
                    <td th:text="${post.writer}">글쓴이</td>
                    <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</td>
                </tr>

                <!-- 글이 하나도 없을 때 -->
                <tr th:if="${#lists.isEmpty(posts)}">
                    <td colspan="4" class="text-center text-muted">등록된 글이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
